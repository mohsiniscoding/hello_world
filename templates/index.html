<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Page Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1f1f2e;
      --text: #c8c8d4;
      --text-muted: #6b6b80;
      --accent: #e8c469;
      --accent-dim: #c9a44e22;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Input Screen ── */
    .input-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, #1a1428 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, #0f1a1a 0%, transparent 50%),
        var(--bg);
    }

    .input-screen h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: .4rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .input-screen .sub {
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
    }

    .form-input, .form-textarea {
      width: 100%;
      max-width: 560px;
      padding: 1rem 1.2rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      transition: border-color .2s, box-shadow .2s;
    }

    .form-input { margin-bottom: 1rem; }
    .form-textarea { min-height: 130px; resize: vertical; }

    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .input-label {
      width: 100%;
      max-width: 560px;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin-bottom: .5rem;
      font-weight: 700;
    }

    .input-label + .input-label { margin-top: 1.2rem; }
    .form-input + .input-label { margin-top: .2rem; }

    .generate-btn {
      margin-top: 1.6rem;
      padding: .9rem 3rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0a0a0f;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .02em;
      transition: transform .15s, box-shadow .15s;
    }
    .generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px #e8c46944;
    }
    .generate-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── Loading Screen ── */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, #1a1428 0%, transparent 70%),
        var(--bg);
    }

    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-screen .status-text { margin-top: 1.2rem; color: var(--text-muted); font-size: .92rem; }
    .loading-screen .progress-text { margin-top: .5rem; color: var(--accent); font-size: .82rem; font-weight: 600; }

    /* ── Output Screen ── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .7rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .toolbar h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--accent);
    }
    .toolbar-btn {
      padding: .45rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .82rem;
    }
    .toolbar-btn:hover { border-color: var(--accent); }

    .tab-bar {
      display: flex;
      gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab-btn {
      padding: .6rem 1.4rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .tab-btn.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .page-frame { width: 100%; background: #fff; min-height: 100vh; }
    .page-frame iframe { width: 100%; height: calc(100vh - 90px); border: none; display: block; }

    /* ── Error ── */
    .error-box {
      max-width: 560px;
      margin-top: 1rem;
      padding: 1rem 1.2rem;
      background: #1a1015;
      border: 1px solid #3d1c2a;
      border-radius: 8px;
      color: #e87a7a;
      font-size: .88rem;
      line-height: 1.5;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Input Screen -->
    <div v-if="screen === 'input'" class="input-screen">
      <h1>SaaS Page Generator</h1>
      <p class="sub">Describe your SaaS app idea and get production-ready page mockups — unique, beautifully designed, ready for screenshots.</p>

      <div class="input-label">Anthropic API Key</div>
      <input
        v-model="apiKey"
        class="form-input"
        type="password"
        placeholder="sk-ant-api03-…"
        @keydown.enter="$refs.ideaInput.focus()"
      />

      <div class="input-label">Your SaaS Idea</div>
      <textarea
        ref="ideaInput"
        v-model="idea"
        class="form-textarea"
        placeholder="e.g. An AI-powered veterinary clinic management platform that handles appointment scheduling, pet medical records, telemedicine consultations, and automated prescription refills..."
      ></textarea>

      <button
        class="generate-btn"
        :disabled="generating"
        @click="generate"
      >
        Generate Pages
      </button>

      <div v-if="error" class="error-box">{{ error }}</div>
    </div>

    <!-- Loading Screen -->
    <div v-if="screen === 'loading'" class="loading-screen">
      <div class="spinner"></div>
      <p class="status-text">{{ loadingText }}</p>
      <p class="progress-text">{{ progressText }}</p>
    </div>

    <!-- Output Screen -->
    <div v-if="screen === 'output'">
      <div class="toolbar">
        <h2>{{ appName }} — Page Mockups</h2>
        <button class="toolbar-btn" @click="reset">← New Idea</button>
      </div>
      <div class="tab-bar">
        <button
          v-for="(page, i) in pages"
          :key="i"
          class="tab-btn"
          :class="{ active: currentPage === i }"
          @click="showPage(i)"
        >
          {{ page.name }}
        </button>
      </div>
      <div class="page-frame">
        <iframe ref="pageIframe"></iframe>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref, nextTick } = Vue;

    createApp({
      setup() {
        const screen = ref('input');
        const apiKey = ref('');
        const idea = ref('');
        const error = ref('');
        const generating = ref(false);
        const loadingText = ref('');
        const progressText = ref('');
        const appName = ref('');
        const pages = ref([]);
        const currentPage = ref(0);
        const pageIframe = ref(null);

        async function generate() {
          error.value = '';
          if (!apiKey.value.trim()) { error.value = 'Please enter your Anthropic API key.'; return; }
          if (!idea.value.trim()) { error.value = 'Please describe your SaaS idea.'; return; }

          generating.value = true;
          screen.value = 'loading';
          loadingText.value = 'Starting…';
          progressText.value = '';
          pages.value = [];

          try {
            const res = await fetch('/api/generate', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                apiKey: apiKey.value.trim(),
                idea: idea.value.trim(),
              }),
            });

            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || `Server error ${res.status}`);
            }

            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';

            while (true) {
              const { done, value } = await reader.read();
              if (done) break;

              buffer += decoder.decode(value, { stream: true });
              const lines = buffer.split('\n');
              buffer = lines.pop();

              for (const line of lines) {
                if (!line.trim()) continue;
                const event = JSON.parse(line);

                switch (event.step) {
                  case 'aesthetics':
                    loadingText.value = event.message;
                    progressText.value = 'Step 1 of 3';
                    break;

                  case 'planning':
                    loadingText.value = event.message;
                    progressText.value = 'Step 2 of 3';
                    break;

                  case 'plan_ready':
                    appName.value = event.appName;
                    break;

                  case 'generating':
                    loadingText.value = event.message;
                    progressText.value = `Step 3 of 3 — Page ${event.pageIndex + 1} of ${event.totalPages}`;
                    break;

                  case 'page_ready':
                    pages.value.push({ name: event.pageName, html: event.html });
                    break;

                  case 'done':
                    screen.value = 'output';
                    currentPage.value = 0;
                    await nextTick();
                    writeIframe(0);
                    break;

                  case 'error':
                    throw new Error(event.message);
                }
              }
            }
          } catch (e) {
            screen.value = 'input';
            error.value = e.message;
          } finally {
            generating.value = false;
          }
        }

        function writeIframe(index) {
          const iframe = pageIframe.value;
          if (!iframe || !pages.value[index]) return;
          const doc = iframe.contentDocument;
          doc.open();
          doc.write(pages.value[index].html);
          doc.close();
        }

        async function showPage(index) {
          currentPage.value = index;
          await nextTick();
          writeIframe(index);
        }

        function reset() {
          screen.value = 'input';
          pages.value = [];
          currentPage.value = 0;
          appName.value = '';
          error.value = '';
        }

        return {
          screen, apiKey, idea, error, generating,
          loadingText, progressText, appName,
          pages, currentPage, pageIframe,
          generate, showPage, reset,
        };
      },
    }).mount('#app');
  </script>
</body>
</html>
