<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Page Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1f1f2e;
      --text: #c8c8d4;
      --text-muted: #6b6b80;
      --accent: #e8c469;
      --accent-dim: #c9a44e22;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Input Screen ── */
    #input-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, #1a1428 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, #0f1a1a 0%, transparent 50%),
        var(--bg);
    }

    #input-screen h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: .4rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    #input-screen p.sub {
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
    }

    #api-key-input, #idea-input {
      width: 100%;
      max-width: 560px;
      padding: 1rem 1.2rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      transition: border-color .2s, box-shadow .2s;
    }

    #api-key-input { margin-bottom: 1rem; }
    #idea-input { min-height: 130px; resize: vertical; }

    #api-key-input:focus, #idea-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .input-label {
      width: 100%;
      max-width: 560px;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin-bottom: .5rem;
      font-weight: 700;
    }

    .input-label:not(:first-of-type) { margin-top: 1.2rem; }

    #generate-btn {
      margin-top: 1.6rem;
      padding: .9rem 3rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0a0a0f;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .02em;
      transition: transform .15s, box-shadow .15s;
    }
    #generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px #e8c46944;
    }
    #generate-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── Output Screen ── */
    #output-screen { display: none; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .7rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .toolbar h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--accent);
    }
    .toolbar button {
      padding: .45rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .82rem;
    }
    .toolbar button:hover { border-color: var(--accent); }

    .tab-bar {
      display: flex;
      gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab-bar button {
      padding: .6rem 1.4rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .tab-bar button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .page-frame { width: 100%; background: #fff; min-height: 100vh; }
    .page-frame iframe { width: 100%; height: calc(100vh - 90px); border: none; display: block; }

    /* ── Loading ── */
    #loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, #1a1428 0%, transparent 70%),
        var(--bg);
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { margin-top: 1.2rem; color: var(--text-muted); font-size: .92rem; }
    #loading .page-progress { margin-top: .5rem; color: var(--accent); font-size: .82rem; font-weight: 600; }

    /* ── Error ── */
    #error-box {
      display: none;
      max-width: 560px;
      margin-top: 1rem;
      padding: 1rem 1.2rem;
      background: #1a1015;
      border: 1px solid #3d1c2a;
      border-radius: 8px;
      color: #e87a7a;
      font-size: .88rem;
      line-height: 1.5;
      width: 100%;
    }
  </style>
</head>
<body>

<!-- Input -->
<div id="input-screen">
  <h1>SaaS Page Generator</h1>
  <p class="sub">Describe your SaaS app idea and get production-ready page mockups — unique, beautifully designed, ready for screenshots.</p>

  <div class="input-label">Anthropic API Key</div>
  <input id="api-key-input" type="password" placeholder="sk-ant-api03-…" />

  <div class="input-label">Your SaaS Idea</div>
  <textarea id="idea-input" placeholder="e.g. An AI-powered veterinary clinic management platform that handles appointment scheduling, pet medical records, telemedicine consultations, and automated prescription refills..."></textarea>

  <button id="generate-btn" onclick="generate()">Generate Pages</button>
  <div id="error-box"></div>
</div>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">Analyzing your idea…</p>
  <div class="page-progress" id="page-progress"></div>
</div>

<!-- Output -->
<div id="output-screen">
  <div class="toolbar">
    <h2 id="app-title"></h2>
    <button onclick="location.reload()">← New Idea</button>
  </div>
  <div class="tab-bar" id="tab-bar"></div>
  <div class="page-frame" id="page-frame"></div>
</div>

<script>
const AESTHETICS_PROMPT = `You tend to converge toward generic, "on distribution" outputs. In frontend design, this creates what users call the "AI slop" aesthetic. Avoid this: make creative, distinctive frontends that surprise and delight. Focus on:

Typography: Choose fonts that are beautiful, unique, and interesting. Use Google Fonts imports. Avoid generic fonts like Arial, Inter, Roboto; opt instead for distinctive choices that elevate the frontend's aesthetics.

Color & Theme: Commit to a cohesive aesthetic. Use CSS variables for consistency. Dominant colors with sharp accents outperform timid, evenly-distributed palettes. Draw from IDE themes and cultural aesthetics for inspiration.

Motion: Use CSS animations for effects and micro-interactions. Focus on high-impact moments: one well-orchestrated page load with staggered reveals (animation-delay) creates more delight than scattered micro-interactions.

Backgrounds: Create atmosphere and depth rather than defaulting to solid colors. Layer CSS gradients, use geometric patterns, or add contextual effects that match the overall aesthetic.

Avoid generic AI-generated aesthetics:
- Overused font families (Inter, Roboto, Arial, system fonts, Space Grotesk)
- Clichéd color schemes (particularly purple gradients on white backgrounds)
- Predictable layouts and component patterns
- Cookie-cutter design that lacks context-specific character

Interpret creatively and make unexpected choices that feel genuinely designed for the context. Vary between light and dark themes, different fonts, different aesthetics. Think outside the box!`;

const SYSTEM_PROMPT = `You are an expert frontend designer who creates production-ready HTML/CSS page mockups for SaaS applications. Your pages are meant to be used as screenshot material — they must look polished, realistic, and visually striking.

${AESTHETICS_PROMPT}

CRITICAL RULES:
1. Return ONLY the raw HTML. No markdown, no code fences, no explanation.
2. Each page must be a complete standalone HTML document with embedded CSS and Google Fonts imports.
3. Use realistic placeholder data (names, numbers, dates, etc.) that matches the SaaS context.
4. Pages are static visual mockups — no JavaScript needed, no functionality.
5. Make the design feel like a real product, not a template.
6. Every page for the SAME app must share a consistent design language (same fonts, colors, spacing conventions) while being contextually different.`;

let pages = [];
let currentPage = 0;

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}

function hideError() {
  document.getElementById('error-box').style.display = 'none';
}

async function callAnthropic(apiKey, messages, systemPrompt) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 16000,
      system: systemPrompt,
      messages: messages
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API error ${res.status}`);
  }

  const data = await res.json();
  return data.content[0].text;
}

async function generate() {
  const apiKey = document.getElementById('api-key-input').value.trim();
  const idea = document.getElementById('idea-input').value.trim();

  hideError();

  if (!apiKey) { showError('Please enter your Anthropic API key.'); return; }
  if (!idea) { showError('Please describe your SaaS idea.'); return; }

  document.getElementById('generate-btn').disabled = true;
  document.getElementById('input-screen').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';

  const loadingText = document.getElementById('loading-text');
  const pageProgress = document.getElementById('page-progress');

  try {
    // Step 1: Ask Claude which pages to generate and the design direction
    loadingText.textContent = 'Planning pages & design direction…';
    pageProgress.textContent = '';

    const planResponse = await callAnthropic(apiKey, [
      {
        role: 'user',
        content: `SaaS idea: "${idea}"

Decide which pages are most important for this specific SaaS app. Pick 3-5 pages that best represent the product (e.g. landing page, dashboard, specific feature pages, pricing, onboarding, settings — whatever makes sense for THIS idea).

Also decide on a distinctive visual identity:
- A creative app name
- A unique color palette (avoid purple/indigo gradients — think outside the box)
- A distinctive typography pairing from Google Fonts (avoid Inter, Roboto, Space Grotesk, DM Sans)
- An overall aesthetic direction (e.g. brutalist, editorial, neo-retro, minimal Japanese, warm craft, cyberpunk dashboard, etc.)

Respond in this exact JSON format only, no other text:
{
  "appName": "...",
  "pages": ["Page Name 1", "Page Name 2", ...],
  "designDirection": "Brief description of the visual identity, colors, fonts, and aesthetic to use consistently across all pages"
}`
      }
    ], SYSTEM_PROMPT);

    let plan;
    try {
      // Extract JSON from response (handle potential markdown wrapping)
      const jsonMatch = planResponse.match(/\{[\s\S]*\}/);
      plan = JSON.parse(jsonMatch ? jsonMatch[0] : planResponse);
    } catch (e) {
      throw new Error('Failed to parse plan from AI. Please try again.');
    }

    const appName = plan.appName || 'SaaSApp';
    const pageList = plan.pages || ['Landing Page', 'Dashboard', 'Pricing'];
    const designDirection = plan.designDirection || '';

    document.getElementById('app-title').textContent = appName + ' — Page Mockups';

    // Step 2: Generate each page sequentially so design stays consistent
    pages = [];
    const generatedDescriptions = [];

    for (let i = 0; i < pageList.length; i++) {
      const pageName = pageList[i];
      loadingText.textContent = `Generating ${pageName}…`;
      pageProgress.textContent = `Page ${i + 1} of ${pageList.length}`;

      const contextMessages = [
        {
          role: 'user',
          content: `SaaS idea: "${idea}"
App name: "${appName}"
Design direction: ${designDirection}

${generatedDescriptions.length > 0 ? `Previously generated pages (maintain consistent design language):\n${generatedDescriptions.map((d, j) => `- ${d}`).join('\n')}\n\n` : ''}Generate the "${pageName}" page as a complete, standalone HTML document.

Requirements:
- Complete <!DOCTYPE html> document with all CSS embedded in <style> tags
- Import Google Fonts via <link> tags in the <head>
- Realistic, contextually appropriate placeholder content
- Designed at 1440px wide desktop viewport
- The page should look like a real product screenshot
- Maintain the same fonts, color palette, and design language as specified in the design direction
${generatedDescriptions.length > 0 ? '- Must feel like it belongs to the same app as the previously generated pages' : ''}

Return ONLY the raw HTML. No markdown fences, no explanation.`
        }
      ];

      const html = await callAnthropic(apiKey, contextMessages, SYSTEM_PROMPT);

      // Clean up any markdown fences if present
      let cleanHtml = html.trim();
      if (cleanHtml.startsWith('```')) {
        cleanHtml = cleanHtml.replace(/^```html?\n?/, '').replace(/\n?```$/, '');
      }

      pages.push({ name: pageName, html: cleanHtml });
      generatedDescriptions.push(`${pageName}: generated with consistent ${appName} branding`);
    }

    // Step 3: Show results
    renderTabs();
    showPage(0);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('output-screen').style.display = 'block';

  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('input-screen').style.display = 'flex';
    document.getElementById('generate-btn').disabled = false;
    showError(err.message);
  }
}

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  pages.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.textContent = p.name;
    btn.className = i === currentPage ? 'active' : '';
    btn.onclick = () => showPage(i);
    bar.appendChild(btn);
  });
}

function showPage(i) {
  currentPage = i;
  renderTabs();
  const frame = document.getElementById('page-frame');
  frame.innerHTML = '';
  const iframe = document.createElement('iframe');
  frame.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(pages[i].html);
  iframe.contentDocument.close();
}
</script>
</body>
</html>
