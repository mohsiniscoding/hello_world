<!DOCTYPE html>
<html lang="en">
<head>

    #input-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }

    #generate-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }

    /* ── Output Screen ── */
    #output-screen { display: none; }
    .toolbar { position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 1rem; padding: .75rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; }
    .toolbar h2 { font-size: 1rem; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .toolbar button { padding: .5rem 1.2rem; border: 1px solid #334155; border-radius: 8px; background: #0f172a; color: #e2e8f0; cursor: pointer; font-size: .85rem; }
    .toolbar button:hover { border-color: #818cf8; }
    .toolbar button.active { background: #6366f1; border-color: #6366f1; color: #fff; }

    .tab-bar { display: flex; gap: 0; background: #1e293b; border-bottom: 1px solid #334155; overflow-x: auto; }
    .tab-bar button { padding: .65rem 1.4rem; border: none; background: transparent; color: #94a3b8; cursor: pointer; font-size: .9rem; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab-bar button.active { color: #818cf8; border-bottom-color: #818cf8; }

    .page-frame { width: 100%; background: #fff; min-height: 100vh; }
    .page-frame iframe { width: 100%; height: calc(100vh - 96px); border: none; display: block; }

    #loading { display: none; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .spinner { width: 48px; height: 48px; border: 4px solid #334155; border-top-color: #818cf8; border-radius: 50%; animation: spin .8s linear infinite; }

    #loading p { margin-top: 1rem; color: #94a3b8; }
  </style>
</head>
<body>

<!-- Input -->
<div id="input-screen">
  <h1>SaaS Page Generator</h1>
  <p class="sub">Describe your SaaS app idea and get production-ready page mockups perfect for screenshots.</p>
  <textarea id="idea-input" placeholder="e.g. An AI-powered project management tool for remote teams that tracks time, manages sprints, and provides burndown charts..."></textarea>
  <button id="generate-btn" onclick="generate()">Generate Pages</button>
</div>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">Generating pages…</p>
</div>

<!-- Output -->
<div id="output-screen">
  <div class="toolbar">
    <h2 id="app-title"></h2>
    <button onclick="location.reload()">← New Idea</button>
  </div>
  <div class="tab-bar" id="tab-bar"></div>
  <div class="page-frame" id="page-frame"></div>

<script>
// ── Helpers ──
function extractAppName(idea) {
  const words = idea.trim().split(/\s+/).slice(0, 5);
  // Try to find a short catchy name
  const prefixes = ['Nova','Pulse','Flow','Craft','Sync','Wave','Beam','Core','Loop','Dash','Hive','Apex','Bolt','Edge','Peak','Rise','Flux','Grid','Link','Nest'];
  const suffixes = ['ly','ify','io','hub','base','kit','lab','pad','box','stack','spot','dock','point','forge','zone'];
  const seed = idea.length;
  return prefixes[seed % prefixes.length] + suffixes[(seed * 3) % suffixes.length];
}

function extractColor(idea) {
  const colors = [
    { primary: '#6366f1', gradient: 'linear-gradient(135deg,#6366f1,#a855f7)', light: '#eef2ff', name: 'indigo' },
    { primary: '#3b82f6', gradient: 'linear-gradient(135deg,#3b82f6,#06b6d4)', light: '#eff6ff', name: 'blue' },
    { primary: '#10b981', gradient: 'linear-gradient(135deg,#10b981,#34d399)', light: '#ecfdf5', name: 'green' },
    { primary: '#f59e0b', gradient: 'linear-gradient(135deg,#f59e0b,#f97316)', light: '#fffbeb', name: 'amber' },
    { primary: '#ef4444', gradient: 'linear-gradient(135deg,#ef4444,#f97316)', light: '#fef2f2', name: 'red' },
    { primary: '#8b5cf6', gradient: 'linear-gradient(135deg,#8b5cf6,#ec4899)', light: '#f5f3ff', name: 'violet' },
    { primary: '#0ea5e9', gradient: 'linear-gradient(135deg,#0ea5e9,#6366f1)', light: '#f0f9ff', name: 'sky' },
    { primary: '#14b8a6', gradient: 'linear-gradient(135deg,#14b8a6,#0ea5e9)', light: '#f0fdfa', name: 'teal' },
  ];
  return colors[idea.length % colors.length];
}

function extractFeatures(idea) {
  const text = idea.toLowerCase();
  const featureMap = [
    { kw: ['track','monitor','analytic','metric','report','data','insight','chart','graph','dashboard'], feat: 'Real-time Analytics Dashboard' },
    { kw: ['team','collaborat','share','workspace','member','group','organization'], feat: 'Team Collaboration' },
    { kw: ['ai','intellig','smart','automat','machine','predict','suggest'], feat: 'AI-Powered Automation' },
    { kw: ['project','task','manage','plan','sprint','kanban','board','workflow'], feat: 'Project Management' },
    { kw: ['time','schedule','calendar','deadline','remind'], feat: 'Time Tracking & Scheduling' },
    { kw: ['integrat','connect','api','sync','import','export','webhook'], feat: 'Seamless Integrations' },
    { kw: ['secure','encrypt','privacy','auth','permission','role','access'], feat: 'Enterprise Security' },
    { kw: ['custom','personal','configur','template','theme','brand'], feat: 'Customizable Workflows' },
    { kw: ['notif','alert','email','message','chat','communicat'], feat: 'Smart Notifications' },
    { kw: ['file','document','storage','upload','cloud','backup'], feat: 'Cloud Storage & Documents' },
    { kw: ['invoice','bill','pay','subscri','revenue','financ','price'], feat: 'Billing & Invoicing' },
    { kw: ['customer','client','crm','lead','contact','support','ticket'], feat: 'Customer Management' },
  ];
  const found = [];
  for (const f of featureMap) {
    if (f.kw.some(k => text.includes(k))) found.push(f.feat);
  }
  // Always include some defaults
  const defaults = ['Real-time Analytics Dashboard', 'Team Collaboration', 'AI-Powered Automation', 'Seamless Integrations', 'Enterprise Security', 'Customizable Workflows'];
  for (const d of defaults) {
    if (!found.includes(d)) found.push(d);
    if (found.length >= 6) break;
  }
  return found.slice(0, 6);
}

function extractDescription(idea) {
  if (idea.length > 60) return idea.charAt(0).toUpperCase() + idea.slice(1, 120).trim() + (idea.length > 120 ? '…' : '');
  return `The all-in-one platform to ${idea.toLowerCase().replace(/^(an?|the)\s+/i, '')}`;
}

// ── Main Logic ──
let pages = [];
let currentPage = 0;

function generate() {
  const idea = document.getElementById('idea-input').value.trim();
  if (!idea) return;

  document.getElementById('input-screen').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';

  const ctx = {
    name: extractAppName(idea),
    color: extractColor(idea),
    features: extractFeatures(idea),
    description: extractDescription(idea),
    idea: idea
  };

  // Simulate generation delay
  const loadingText = document.getElementById('loading-text');
  const steps = ['Analyzing your idea…', 'Designing landing page…', 'Building dashboard…', 'Creating pricing page…', 'Finalizing mockups…'];
  let step = 0;
  const interval = setInterval(() => {
    step++;
    if (step < steps.length) loadingText.textContent = steps[step];
  }, 500);

  setTimeout(() => {
    clearInterval(interval);

    pages = [
      { name: 'Landing Page', html: generateLandingPage(ctx) },
      { name: 'Dashboard', html: generateDashboardPage(ctx) },
      { name: 'Pricing', html: generatePricingPage(ctx) },
      { name: 'Login', html: generateLoginPage(ctx) },
    ];

    document.getElementById('app-title').textContent = ctx.name + ' — Page Mockups';
    renderTabs();
    showPage(0);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('output-screen').style.display = 'block';
  }, 2500);
}

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  pages.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.textContent = p.name;
    btn.className = i === currentPage ? 'active' : '';
    btn.onclick = () => showPage(i);
    bar.appendChild(btn);
  });
}

function showPage(i) {
  currentPage = i;
  renderTabs();
  const frame = document.getElementById('page-frame');
  frame.innerHTML = '';
  const iframe = document.createElement('iframe');
  frame.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(pages[i].html);
  iframe.contentDocument.close();
}
</script>
</body>
</html>
