<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SaaS Page Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --border: #1f1f2e;
      --text: #c8c8d4;
      --text-muted: #6b6b80;
      --accent: #e8c469;
      --accent-dim: #c9a44e22;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Input Screen ── */
    #input-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, #1a1428 0%, transparent 70%),
        radial-gradient(circle at 80% 80%, #0f1a1a 0%, transparent 50%),
        var(--bg);
    }

    #input-screen h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      font-weight: 800;
      margin-bottom: .4rem;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    #input-screen p.sub {
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      text-align: center;
      max-width: 480px;
      line-height: 1.6;
    }

    #api-key-input, #idea-input {
      width: 100%;
      max-width: 560px;
      padding: 1rem 1.2rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      transition: border-color .2s, box-shadow .2s;
    }

    #api-key-input { margin-bottom: 1rem; }
    #idea-input { min-height: 130px; resize: vertical; }

    #api-key-input:focus, #idea-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim);
    }

    .input-label {
      width: 100%;
      max-width: 560px;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin-bottom: .5rem;
      font-weight: 700;
    }

    .input-label:not(:first-of-type) { margin-top: 1.2rem; }

    #generate-btn {
      margin-top: 1.6rem;
      padding: .9rem 3rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #0a0a0f;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: .02em;
      transition: transform .15s, box-shadow .15s;
    }
    #generate-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px #e8c46944;
    }
    #generate-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* ── Output Screen ── */
    #output-screen { display: none; }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .7rem 1.5rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .toolbar h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--accent);
    }
    .toolbar button {
      padding: .45rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .82rem;
    }
    .toolbar button:hover { border-color: var(--accent); }

    .tab-bar {
      display: flex;
      gap: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }
    .tab-bar button {
      padding: .6rem 1.4rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
    }
    .tab-bar button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .page-frame { width: 100%; background: #fff; min-height: 100vh; }
    .page-frame iframe { width: 100%; height: calc(100vh - 90px); border: none; display: block; }

    /* ── Loading ── */
    #loading {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, #1a1428 0%, transparent 70%),
        var(--bg);
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { margin-top: 1.2rem; color: var(--text-muted); font-size: .92rem; }
    #loading .page-progress { margin-top: .5rem; color: var(--accent); font-size: .82rem; font-weight: 600; }

    /* ── Error ── */
    #error-box {
      display: none;
      max-width: 560px;
      margin-top: 1rem;
      padding: 1rem 1.2rem;
      background: #1a1015;
      border: 1px solid #3d1c2a;
      border-radius: 8px;
      color: #e87a7a;
      font-size: .88rem;
      line-height: 1.5;
      width: 100%;
    }
  </style>
</head>
<body>

<!-- Input -->
<div id="input-screen">
  <h1>SaaS Page Generator</h1>
  <p class="sub">Describe your SaaS app idea and get production-ready page mockups — unique, beautifully designed, ready for screenshots.</p>

  <div class="input-label">Anthropic API Key</div>
  <input id="api-key-input" type="password" placeholder="sk-ant-api03-…" />

  <div class="input-label">Your SaaS Idea</div>
  <textarea id="idea-input" placeholder="e.g. An AI-powered veterinary clinic management platform that handles appointment scheduling, pet medical records, telemedicine consultations, and automated prescription refills..."></textarea>

  <button id="generate-btn" onclick="generate()">Generate Pages</button>
  <div id="error-box"></div>
</div>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p id="loading-text">Analyzing your idea…</p>
  <div class="page-progress" id="page-progress"></div>
</div>

<!-- Output -->
<div id="output-screen">
  <div class="toolbar">
    <h2 id="app-title"></h2>
    <button onclick="location.reload()">← New Idea</button>
  </div>
  <div class="tab-bar" id="tab-bar"></div>
  <div class="page-frame" id="page-frame"></div>
</div>

<script>
const BASE_AESTHETICS_PROMPT = `You tend to converge toward generic, "on distribution" outputs. In frontend design, this creates what users call the "AI slop" aesthetic. Avoid this: make creative, distinctive frontends that surprise and delight. Focus on:

Typography: Choose fonts that are beautiful, unique, and interesting. Use Google Fonts imports. Avoid generic fonts like Arial, Inter, Roboto; opt instead for distinctive choices that elevate the frontend's aesthetics.

Color & Theme: Commit to a cohesive aesthetic. Use CSS variables for consistency. Dominant colors with sharp accents outperform timid, evenly-distributed palettes. Draw from IDE themes and cultural aesthetics for inspiration.

Motion: Use CSS animations for effects and micro-interactions. Focus on high-impact moments: one well-orchestrated page load with staggered reveals (animation-delay) creates more delight than scattered micro-interactions.

Backgrounds: Create atmosphere and depth rather than defaulting to solid colors. Layer CSS gradients, use geometric patterns, or add contextual effects that match the overall aesthetic.

Avoid generic AI-generated aesthetics:
- Overused font families (Inter, Roboto, Arial, system fonts, Space Grotesk)
- Clichéd color schemes (particularly purple gradients on white backgrounds)
- Predictable layouts and component patterns
- Cookie-cutter design that lacks context-specific character

Interpret creatively and make unexpected choices that feel genuinely designed for the context. Vary between light and dark themes, different fonts, different aesthetics. Think outside the box!`;

let pages = [];
let currentPage = 0;

function showError(msg) {
  const box = document.getElementById('error-box');
  box.textContent = msg;
  box.style.display = 'block';
}

function hideError() {
  document.getElementById('error-box').style.display = 'none';
}

async function callAnthropic(apiKey, messages, systemPrompt, maxTokens = 16000) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: maxTokens,
      system: systemPrompt,
      messages: messages
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API error ${res.status}`);
  }

  const data = await res.json();
  return data.content[0].text;
}

async function generate() {
  const apiKey = document.getElementById('api-key-input').value.trim();
  const idea = document.getElementById('idea-input').value.trim();

  hideError();

  if (!apiKey) { showError('Please enter your Anthropic API key.'); return; }
  if (!idea) { showError('Please describe your SaaS idea.'); return; }

  document.getElementById('generate-btn').disabled = true;
  document.getElementById('input-screen').style.display = 'none';
  document.getElementById('loading').style.display = 'flex';

  const loadingText = document.getElementById('loading-text');
  const pageProgress = document.getElementById('page-progress');

  try {
    // ── Step 1: Customize the aesthetics prompt for this specific SaaS idea ──
    loadingText.textContent = 'Crafting a unique design identity…';
    pageProgress.textContent = 'Step 1 of 3';

    const customAestheticsResponse = await callAnthropic(apiKey, [
      {
        role: 'user',
        content: `I have a SaaS app idea:
"${idea}"

Below is a generic frontend aesthetics guide. Your job is to CUSTOMIZE it specifically for this SaaS idea. Produce a tailored version that:
- Picks specific Google Fonts that match the mood/industry of this SaaS (give exact font names)
- Defines a specific color palette with exact hex codes (primary, secondary, accent, background, text colors) that feels right for this domain
- Chooses a specific aesthetic direction (not generic — something like "warm editorial with craft textures" or "clinical Swiss design with mint accents" or "dark observatory dashboard with amber data-glow") that suits this product
- Specifies exact CSS variable definitions to use
- Describes the specific mood, spacing rhythm, border-radius style, and shadow approach
- Describes specific background treatments (gradients, patterns, textures) to use

Here is the base guide to customize:

${BASE_AESTHETICS_PROMPT}

Return ONLY the customized aesthetics prompt as plain text (no JSON, no markdown fences). It should be a self-contained design specification document that another AI can follow to build consistent pages.`
      }
    ], 'You are an elite brand designer and creative director. You create distinctive, memorable visual identities for digital products. You never default to safe, generic choices — you make bold, cohesive decisions that feel intentional and unique to each product.', 4000);

    const customizedAestheticsPrompt = customAestheticsResponse.trim();

    // ── Step 2: Plan which pages to generate ──
    loadingText.textContent = 'Planning pages…';
    pageProgress.textContent = 'Step 2 of 3';

    const PAGE_SYSTEM = `You are a SaaS product strategist specializing in portfolio presentation. You select pages that will impress potential clients viewing a developer/designer's portfolio. The screenshots need to demonstrate technical skill, design taste, and product thinking.`;

    const planResponse = await callAnthropic(apiKey, [
      {
        role: 'user',
        content: `SaaS idea: "${idea}"

These page mockups will be used as portfolio screenshots to attract potential clients. Pick 3 to 5 pages that are the most visually impressive and demonstrate strong product design.

Rules:
- The FIRST page MUST always be "Landing Page" — this is the hero piece of any portfolio showcase
- The remaining 2-4 pages should be the most interesting, data-rich, or visually complex pages for THIS specific SaaS — things like dashboards with charts, detailed feature views, rich data tables, calendar/scheduling views, analytics screens, etc.
- Avoid boring pages like plain settings, empty states, or simple forms — pick pages that wow a client when they see the screenshot
- Choose pages specific to THIS product's domain (e.g. a fitness app needs a workout tracker view, a finance app needs a portfolio/transactions screen)

Also invent a creative, memorable app name for this product.

Respond in this exact JSON format only, no other text:
{
  "appName": "...",
  "pages": ["Landing Page", "Page Name 2", ...]
}`
      }
    ], PAGE_SYSTEM, 1000);

    let plan;
    try {
      const jsonMatch = planResponse.match(/\{[\s\S]*\}/);
      plan = JSON.parse(jsonMatch ? jsonMatch[0] : planResponse);
    } catch (e) {
      throw new Error('Failed to parse page plan from AI. Please try again.');
    }

    const appName = plan.appName || 'SaaSApp';
    const pageList = (plan.pages || ['Landing Page', 'Dashboard', 'Pricing']).slice(0, 5);
    // Ensure Landing Page is always first
    if (!pageList[0]?.toLowerCase().includes('landing')) {
      const idx = pageList.findIndex(p => p.toLowerCase().includes('landing'));
      if (idx > 0) { const lp = pageList.splice(idx, 1)[0]; pageList.unshift(lp); }
      else pageList.unshift('Landing Page');
    }
    // Enforce 3-5 range
    if (pageList.length < 3) {
      const fillers = ['Dashboard', 'Pricing'];
      for (const f of fillers) { if (pageList.length >= 3) break; if (!pageList.includes(f)) pageList.push(f); }
    }
    if (pageList.length > 5) pageList.length = 5;

    document.getElementById('app-title').textContent = appName + ' — Page Mockups';

    // ── Step 3: Generate each page using the customized aesthetics prompt ──
    const GENERATION_SYSTEM = `You are an expert frontend developer who creates production-ready HTML/CSS page mockups for SaaS applications. Your pages are meant to be used as screenshot material — they must look polished, realistic, and visually striking.

Follow this design specification EXACTLY:

${customizedAestheticsPrompt}

CONTEXT: These mockups will be used as portfolio screenshots to impress potential clients. They must look like real, polished, shipped products — not student projects or templates.

CRITICAL RULES:
1. Return ONLY the raw HTML. No markdown, no code fences, no explanation.
2. Each page must be a complete standalone HTML document with embedded CSS and Google Fonts imports via <link> tags.
3. Use realistic placeholder data (names, numbers, dates, etc.) that matches the SaaS context. Fill every section with convincing content — no "lorem ipsum" or empty placeholders.
4. Pages are static visual mockups — no JavaScript needed, no functionality.
5. Make the design feel like a real shipped product that a well-funded startup would have.
6. Every page must share the SAME design language — same fonts, same CSS variables, same color palette, same spacing and border-radius conventions.
7. Pages should be DENSE with content and visual detail — data-rich dashboards, populated tables, filled-out cards, realistic charts (use CSS/SVG). Empty-looking pages are unacceptable for portfolio use.`;

    pages = [];
    const generatedDescriptions = [];

    for (let i = 0; i < pageList.length; i++) {
      const pageName = pageList[i];
      loadingText.textContent = `Generating ${pageName}…`;
      pageProgress.textContent = `Step 3 of 3 — Page ${i + 1} of ${pageList.length}`;

      const contextMessages = [
        {
          role: 'user',
          content: `SaaS idea: "${idea}"
App name: "${appName}"

${generatedDescriptions.length > 0 ? `Previously generated pages (you MUST maintain the exact same design language — same fonts, colors, CSS variables, spacing):\n${generatedDescriptions.join('\n')}\n\n` : ''}Generate the "${pageName}" page as a complete, standalone HTML document.

This will be used as a portfolio screenshot to win client projects. It MUST look impressive.

Requirements:
- Complete <!DOCTYPE html> document with all CSS embedded in <style> tags
- Import Google Fonts via <link> tags in the <head>
- Use the EXACT CSS variables, fonts, and color palette from the design specification in your system prompt
- DENSE, realistic content — fill every section with convincing placeholder data (real-sounding names, plausible numbers, realistic dates). No empty sections or lorem ipsum.
- Designed at 1440px wide desktop viewport
- Must look like a screenshot of a real product built by a top-tier design agency
- For dashboards/data pages: include populated charts (CSS/SVG), filled tables, stat cards with real numbers, activity feeds
- For landing pages: include hero, features, social proof with company names, testimonials, CTA sections
${generatedDescriptions.length > 0 ? '- MUST use the same CSS variables, fonts, and design tokens as previous pages' : ''}

Return ONLY the raw HTML. No markdown fences, no explanation.`
        }
      ];

      const html = await callAnthropic(apiKey, contextMessages, GENERATION_SYSTEM);

      let cleanHtml = html.trim();
      if (cleanHtml.startsWith('```')) {
        cleanHtml = cleanHtml.replace(/^```html?\n?/, '').replace(/\n?```$/, '');
      }

      pages.push({ name: pageName, html: cleanHtml });
      generatedDescriptions.push(`- ${pageName}: completed with consistent ${appName} branding and shared design tokens`);
    }

    // Show results
    renderTabs();
    showPage(0);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('output-screen').style.display = 'block';

  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('input-screen').style.display = 'flex';
    document.getElementById('generate-btn').disabled = false;
    showError(err.message);
  }
}

function renderTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  pages.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.textContent = p.name;
    btn.className = i === currentPage ? 'active' : '';
    btn.onclick = () => showPage(i);
    bar.appendChild(btn);
  });
}

function showPage(i) {
  currentPage = i;
  renderTabs();
  const frame = document.getElementById('page-frame');
  frame.innerHTML = '';
  const iframe = document.createElement('iframe');
  frame.appendChild(iframe);
  iframe.contentDocument.open();
  iframe.contentDocument.write(pages[i].html);
  iframe.contentDocument.close();
}
</script>
</body>
</html>
